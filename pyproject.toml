[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synipopt"
version = "0.1.0"
description = "Single-target IPv4 SYN probe with IP options, for CVE-2026-98432 lab research"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "raahilmw"}]
keywords = ["cve-2026-98432", "ipv4", "tcp", "raw-sockets", "security-research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
synipopt = "synipopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
